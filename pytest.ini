[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --import-mode=importlib
markers =
    tier1: Tier 1 Feature Coverage tests
    tier2: Tier 2 Boundary & Corner cases
    tier3: Tier 3 Cross-Feature Interactions
    tier4: Tier 4 Real-World Application & Latency Scenarios
    m1: Milestone 1 features
    m2: Milestone 2 features
    m3: Milestone 3 features
    m4: Milestone 4 features
    m5: Milestone 5 features
